name: Проверка доступности объявлений

on:
  schedule:
    - cron: '17 5 * * *'   # ежедневно 05:17 UTC (08:17 Киев)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить объявления на OLX
        run: node scripts/check-dead.mjs
      - name: Закоммитить dead.json, если изменился
        run: |
          if ! git diff --quiet dead.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add dead.json
            git commit -m 'dead.json: автопроверка доступности объявлений'
            git push
          else
            echo 'изменений нет'
          fi
